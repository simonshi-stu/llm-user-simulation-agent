name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Offline tests (no API key, no simulator framework)
        run: python -m pytest -q

      - name: No-network smoke check
        run: python comprehensive_evaluation.py --dry-run

      - name: P3 demo contract + loopback self check (offline)
        run: python demo_app.py --check

      - name: P1 synthetic smoke (offline fake callables)
        run: python p1_smoke.py synthetic --output-dir "$RUNNER_TEMP/p1-smoke-out"
