name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Offline tests (no API key, no real data, no model)
        # The cross-repository test skips explicitly when the sibling B checkout
        # is absent; CI must not fabricate a B mirror.
        run: python -m pytest -q -ra

      - name: Evaluation dry-run and Demo contract check
        run: |
          python comprehensive_evaluation.py --dry-run
          python demo_app.py --check

      - name: Stage-1 synthetic export
        run: |
          python -m user_simulator_project --dry-run
          python -m user_simulator_project --synthetic --max-tasks 3 --output-dir results/ci_synthetic

      - name: Frontend syntax
        run: node --check web_demo/app.js
